<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F15">
  <title>Mi panel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23DBF266'/%3E%3Cpath d='M9 8v16M16 8v10M23 8v6' stroke='%230B0F15' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div class="app" id="app">

    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 4v16M12 4v10M19 4v6"/></svg>
        </span>
        <span class="brand-name">Mi panel</span>
        <button type="button" class="icon-btn" id="hideSidebar" aria-label="Ocultar menú">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16 10l-2 2 2 2"/></svg>
        </button>
      </div>

      <nav class="nav">
        <a href="#" class="nav-item active" aria-current="page">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="nav-label">Personal</span>
          <span class="nav-count" id="taskCount"></span>
        </a>
        <span class="nav-item disabled" aria-disabled="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span class="nav-label">Trabajo</span>
          <span class="soon">Pronto</span>
        </span>
        <span class="nav-item disabled" aria-disabled="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          <span class="nav-label">Calendario</span>
          <span class="soon">Pronto</span>
        </span>
      </nav>

      <nav class="nav">
        <p class="nav-heading">Organizar</p>
        <button type="button" class="nav-item" id="openTags">
          <svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span class="nav-label">Etiquetas</span>
        </button>
        <button type="button" class="nav-item" id="openSettings">
          <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          <span class="nav-label">Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sync-box">
        <p class="nav-heading">Última sincronización</p>
        <div class="sync-row"><span>Todoist</span><span id="syncSide">—</span></div>
      </div>
    </aside>

    <div class="scrim" id="sidebarScrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <div class="title-group">
          <button type="button" class="icon-btn outline menu-btn" id="showSidebar" aria-label="Mostrar menú">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M14 10l2 2-2 2"/></svg>
          </button>
          <div>
            <label class="eyebrow" for="projectSelect">Todoist ·
              <select id="projectSelect" class="project-select"></select>
            </label>
            <h1>Personal</h1>
          </div>
        </div>
        <div class="actions">
          <span class="sync-info" id="syncInfo"></span>
          <button type="button" class="btn ghost" id="syncBtn">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            <span>Sincronizar</span>
          </button>
          <button type="button" class="btn primary" id="addBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span>Añadir tarea</span>
          </button>
        </div>
      </header>

      <section class="tagbar" id="tagbar" aria-label="Etiquetas"></section>

      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>
    </main>
  </div>

  <div class="scrim drawer-scrim" id="drawerScrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Tarea" hidden></aside>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="Sortable.min.js"></script>
  <script src="app.js?v=1"></script>
</body>
</html>

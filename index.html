      <nav class="nav">
        <a href="#" class="nav-item active" aria-current="page" data-view="personal">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="nav-label">Personal</span>
        </a>
        <span class="nav-item disabled" aria-disabled="true" title="Próximamente">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span class="nav-label">Trabajo</span>
        </span>
        <span class="nav-item disabled" aria-disabled="true" title="Próximamente">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          <span class="nav-label">Calendario</span>
        </span>
        <a href="#" class="nav-item" data-view="contactos">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M3 8h4M3 12h4M3 16h4"/><circle cx="12.5" cy="10" r="2.5"/><path d="M8.5 17c.6-2 2.2-3 4-3s3.4 1 4 3"/></svg>
          <span class="nav-label">Contactos</span>
        </a>
        <a href="#" class="nav-item" data-view="gastos">
          <svg viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M3 6a1 1 0 0 0 1 1h16a1 1 0 0 1 1 1v4h-4a2 2 0 0 0 0 4h4"/></svg>
          <span class="nav-label">Gastos</span>
        </a>
        <a href="#" class="nav-item" data-view="consumos">
          <svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></svg>
          <span class="nav-label">Consumos</span>
        </a>
      </nav>

      <nav class="nav nav-tools" aria-label="Organizar">
        <button type="button" class="nav-item" id="openTags">
          <svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span class="nav-label">Etiquetas</span>
        </button>
        <button type="button" class="nav-item" id="openSettings">
          <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          <span class="nav-label">Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sync-box" title="Última sincronización">
        <div class="sync-line"><span>Todoist</span><span id="syncSide">—</span></div>
        <div class="sync-line" id="syncOd" hidden><span>OneDrive</span><span id="syncOdState">—</span></div>
        <div class="sync-line" id="syncGg" hidden><span>Google</span><span id="syncGgState">—</span></div>
      </div>

      <button type="button" class="icon-btn hide-btn" id="hideSidebar" aria-label="Ocultar menú">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16 10l-2 2 2 2"/></svg>
      </button>
    </aside>

    <div class="scrim" id="sidebarScrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <div class="title-group">
          <button type="button" class="icon-btn outline menu-btn" id="showSidebar" aria-label="Mostrar menú">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M14 10l2 2-2 2"/></svg>
          </button>
          <div>
            <label class="eyebrow" for="projectSelect" id="eyebrowTodoist">Todoist ·
              <select id="projectSelect" class="project-select"></select>
            </label>
            <span class="eyebrow" id="eyebrowOther" hidden></span>
            <h1 id="viewTitle">Personal</h1>
          </div>
        </div>
        <div class="actions">
          <span class="sync-info" id="syncInfo"></span>
          <button type="button" class="btn ghost" id="syncBtn">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            <span>Sincronizar</span>
          </button>
          <button type="button" class="btn primary" id="addBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span id="addLabel">Añadir tarea</span>
          </button>
        </div>
      </header>

      <section class="tagbar" id="tagbar" aria-label="Etiquetas"></section>

      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board"></div>
      </div>

      <section class="view" id="viewContactos" aria-label="Contactos" hidden></section>
      <section class="view" id="viewGastos" aria-label="Gastos" hidden></section>
      <section class="view" id="viewConsumos" aria-label="Consumos" hidden></section>
    </main>
  </div>

  <div class="scrim drawer-scrim" id="drawerScrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Tarea" hidden></aside>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="Sortable.min.js"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
